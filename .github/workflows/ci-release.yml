name: Build

# Branches are built through their pull request; pushes build only main/develop
# (for the badges) and release tags (for publishing). This avoids two runs per
# commit on a PR branch.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR/branch cancels the run that is still going.
# Tag runs (publishing) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # Native RtMidi builds (from the external/rtmidi submodule)
  # Output layout: artifacts/native/<rid>/native/<library>
  # ---------------------------------------------------------------------------
  native-linux:
    name: RtMidi ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            platform: linux/amd64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - rid: linux-arm
            runner: ubuntu-latest
            platform: linux/arm/v7
            qemu: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      # Ubuntu 20.04 (glibc 2.31, still served by the Ubuntu archive) keeps the library loadable on older distros
      # such as Raspberry Pi OS 11.
      - name: Build librtmidi.so
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src ubuntu:20.04 \
            bash .github/scripts/build-rtmidi-linux.sh artifacts/native/${{ matrix.rid }}/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native
          if-no-files-found: error

  native-windows:
    name: RtMidi ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: Win32
          - rid: win-arm64
            arch: ARM64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Static MSVC runtime so users don't need the VC++ redistributable.
      - name: Build rtmidi.dll
        run: |
          cmake -S external/rtmidi -B build -A ${{ matrix.arch }} \
            -DRTMIDI_BUILD_TESTING=OFF -DRTMIDI_API_JACK=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release
          mkdir -p artifacts/native/${{ matrix.rid }}/native
          cp build/Release/rtmidi.dll artifacts/native/${{ matrix.rid }}/native/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native
          if-no-files-found: error

  native-macos:
    name: RtMidi osx (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build librtmidi.dylib (arm64 + x86_64)
        run: |
          cmake -S external/rtmidi -B build -DCMAKE_BUILD_TYPE=Release \
            -DRTMIDI_BUILD_TESTING=OFF -DRTMIDI_API_JACK=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build --config Release
          mkdir -p artifacts/native/osx/native
          cp -L build/librtmidi.dylib artifacts/native/osx/native/librtmidi.dylib
          lipo -info artifacts/native/osx/native/librtmidi.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx
          path: artifacts/native
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Unit tests (tests/RtMidi.Net.Tests) on .NET 8 and .NET 10. They need no MIDI
  # device; the interop tests run against RtMidi built with its dummy API.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # SonarCloud analysis with coverage runs only when the token is available
      # (not on pull requests from forks). Automatic Analysis must be off in
      # SonarCloud, or the scanner refuses to run.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'daniel127' }}
      SONAR_PROJECT_KEY: Daniel127_RtMidi.Net
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # full history for SonarCloud blame and new-code detection
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build RtMidi (dummy API) for the interop tests
        run: .github/scripts/build-rtmidi-dummy.sh artifacts/test-native

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.HAS_SONAR_TOKEN == 'true'
        with:
          distribution: temurin
          java-version: 17
      # The scanner reads the token from the SONAR_TOKEN environment variable, so it
      # is only given to these two steps and never appears on a command line.
      - name: Start SonarCloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.1.0
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.exclusions="external/**/*" \
            /d:sonar.cs.vscoveragexml.reportsPaths="tests/RtMidi.Net.Tests/bin/Release/*/TestResults/coverage.xml" \
            /d:sonar.cs.vstest.reportsPaths="tests/RtMidi.Net.Tests/bin/Release/*/TestResults/*.trx"

      - name: Test
        run: >
          dotnet test --project tests/RtMidi.Net.Tests --configuration Release
          -p:RtMidiTestLibrary=$PWD/artifacts/test-native/librtmidi.so
          --report-xunit-trx
          --coverage --coverage-output-format xml --coverage-output coverage.xml

      - name: Finish SonarCloud analysis
        if: env.HAS_SONAR_TOKEN == 'true' && !cancelled()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/RtMidi.Net.Tests/bin/Release/*/TestResults/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Managed build + NuGet package with every native library inside
  # ---------------------------------------------------------------------------
  package:
    needs: [native-linux, native-windows, native-macos, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true
      - name: List native libraries
        run: find artifacts/native -type f | sort
      - name: Package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: dotnet build RtMidi.Net/RtMidi.Net.csproj --configuration Release ${{ steps.version.outputs.args }}
      - name: Pack
        run: dotnet pack RtMidi.Net/RtMidi.Net.csproj --configuration Release --no-build --output artifacts/nuget ${{ steps.version.outputs.args }}
      - name: Verify package contents
        run: |
          pkg=$(ls artifacts/nuget/*.nupkg | head -1)
          unzip -l "$pkg"
          for f in \
            runtimes/linux-x64/native/librtmidi.so \
            runtimes/linux-arm64/native/librtmidi.so \
            runtimes/linux-arm/native/librtmidi.so \
            runtimes/win-x64/native/rtmidi.dll \
            runtimes/win-x86/native/rtmidi.dll \
            runtimes/win-arm64/native/rtmidi.dll \
            runtimes/osx/native/librtmidi.dylib \
            lib/net8.0/RtMidi.Net.dll \
            lib/net8.0/RtMidi.Net.xml \
            lib/net10.0/RtMidi.Net.dll \
            lib/net10.0/RtMidi.Net.xml \
            README.md \
            icon.png; do
            unzip -l "$pkg" | grep -q " $f$" || { echo "::error::Missing $f in $pkg"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Use the package on every platform: install it into a small app
  # (tests/RtMidi.Net.PackageTest), load RtMidi and, where virtual ports exist
  # (ALSA, CoreMIDI), open a port, receive Note On/Off events and close, then
  # stress the input callback: messages sent in a loop while clients turn the
  # event on and off, poll and are disposed.
  # Windows MultiMedia has no virtual ports, so Windows lists the ports only.
  # The app is built for .NET 8 and .NET 10, so both library builds are used.
  # ---------------------------------------------------------------------------
  package-test:
    name: Test ${{ matrix.rid }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            mode: alsa
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            mode: alsa
          - rid: linux-arm
            runner: ubuntu-latest
            mode: alsa-qemu
          - rid: win-x64
            runner: windows-latest
            mode: windows
          - rid: win-x86
            runner: windows-latest
            mode: windows
          - rid: win-arm64
            runner: windows-11-arm
            mode: windows
          - rid: osx-arm64
            runner: macos-latest
            mode: macos
    defaults:
      run:
        shell: bash
    env:
      TEST_FRAMEWORKS: net8.0 net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Publish test app with the package
        run: |
          for tfm in $TEST_FRAMEWORKS; do
            dotnet publish tests/RtMidi.Net.PackageTest -c Release -f $tfm -r ${{ matrix.rid }} --self-contained -o package-test/$tfm
          done

      # ALSA needs the sequencer device (/dev/snd/seq). GitHub's Linux VMs ship
      # without it loaded, so install the extra kernel modules and load snd-seq.
      - name: Enable ALSA sequencer
        if: startsWith(matrix.mode, 'alsa')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2t64 || sudo apt-get install -y -q libasound2
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || true
          sudo modprobe snd-seq || true
          if [[ -e /dev/snd/seq ]]; then
            sudo chmod a+rw /dev/snd/seq
            echo "TEST_ARGS=--loopback --stress 20" >> "$GITHUB_ENV"
          else
            echo "::warning::/dev/snd/seq is not available on this runner; running the load test only"
            echo "TEST_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Run (Linux)
        if: matrix.mode == 'alsa'
        run: |
          for tfm in $TEST_FRAMEWORKS; do
            echo "::group::$tfm"
            ./package-test/$tfm/RtMidi.Net.PackageTest $TEST_ARGS
            echo "::endgroup::"
          done

      - name: Set up QEMU
        if: matrix.mode == 'alsa-qemu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      # .NET 8 runs on Ubuntu 20.04 (the oldest glibc the native library supports);
      # .NET 10 needs a newer distro, so it runs on Ubuntu 24.04.
      - name: Run (Linux ARM32 under QEMU)
        if: matrix.mode == 'alsa-qemu'
        run: |
          device_args=""
          if [[ -e /dev/snd/seq ]]; then device_args="--device /dev/snd/seq"; fi
          for tfm in $TEST_FRAMEWORKS; do
            if [[ "$tfm" == net8.0 ]]; then image=ubuntu:20.04; alsa=libasound2; else image=ubuntu:24.04; alsa=libasound2t64; fi
            echo "::group::$tfm ($image)"
            docker run --rm --platform linux/arm/v7 $device_args \
              -v "$PWD/package-test/$tfm:/app" -w /app $image \
              bash -c "apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $alsa && ./RtMidi.Net.PackageTest $TEST_ARGS"
            echo "::endgroup::"
          done

      - name: Run (Windows)
        if: matrix.mode == 'windows'
        run: |
          for tfm in $TEST_FRAMEWORKS; do
            echo "::group::$tfm"
            ./package-test/$tfm/RtMidi.Net.PackageTest.exe --devices
            echo "::endgroup::"
          done

      - name: Run (macOS)
        if: matrix.mode == 'macos'
        run: |
          for tfm in $TEST_FRAMEWORKS; do
            echo "::group::$tfm"
            ./package-test/$tfm/RtMidi.Net.PackageTest --loopback --stress 20
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Publish to nuget.org when a vX.Y.Z tag is pushed, using nuget.org Trusted
  # Publishing (GitHub OIDC -> short-lived API key, no long-lived secret).
  # Requires a Trusted Publishing policy on nuget.org for this repository and
  # workflow file (ci-release.yml), and the NUGET_USER secret with the
  # nuget.org profile name (not the email).
  # ---------------------------------------------------------------------------
  publish:
    needs: [package, package-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC token for NuGet/login
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nuget
      # Requested right before pushing: the temporary key is valid for 1 hour.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push nuget/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
